name: Build Top Vocal Chain

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_args: ""
          - name: macOS
            os: macos-latest
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/TopVocalChain_artefacts/Release/VST3/Top Vocal Chain.vst3" dist/
          Copy-Item -Recurse "build/TopTune_artefacts/Release/VST3/Top Tune.vst3" dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath TopVocal-Plugins-Windows-VST3.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/TopVocalChain_artefacts/Release/VST3/Top Vocal Chain.vst3" dist/
          cp -R "build/TopVocalChain_artefacts/Release/AU/Top Vocal Chain.component" dist/
          cp -R "build/TopTune_artefacts/Release/VST3/Top Tune.vst3" dist/
          cp -R "build/TopTune_artefacts/Release/AU/Top Tune.component" dist/
          # Firma ad-hoc (necesaria en Apple Silicon)
          for b in dist/*.vst3 dist/*.component; do codesign --force --deep --sign - "$b"; done
          cp README.md dist/
          cd dist && ditto -c -k --sequesterRsrc . ../TopVocal-Plugins-macOS-VST3-AU.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TopVocal-Plugins-${{ matrix.name }}
          path: TopVocal-Plugins-*.zip

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
